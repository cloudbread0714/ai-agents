[project]
name = "troubleshoot-lab"
version = "0.1.0"
description = "Local troubleshooting practice: warmup missions, injected failures, daily Slack problem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
lab = "troubleshoot_lab.cli:main"

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troubleshoot_lab"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "../../shared/src", "tests"]
markers = ["sandbox: needs real docker + kind (LAB_SANDBOX=1)"]
