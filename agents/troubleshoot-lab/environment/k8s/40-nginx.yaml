# The nginx-conf ConfigMap is generated by restore.sh from environment/nginx/default.conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lab
  labels: {app: nginx, lab.managed: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: nginx-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: lab
  labels: {app: nginx, lab.managed: "true"}
spec:
  type: NodePort
  selector: {app: nginx}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
