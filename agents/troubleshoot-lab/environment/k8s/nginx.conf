# Base nginx config for the kind environment. restore.sh turns this file into the
# nginx-conf ConfigMap. The api Service has a stable ClusterIP, so a static upstream is fine.
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=lab:10m max_size=50m inactive=1h;

upstream api {
    server api.lab.svc.cluster.local:8000;
}

server {
    listen 80;

    add_header X-Cache-Status $upstream_cache_status always;

    location /healthz {
        proxy_pass http://api/healthz;
    }

    location /api/ {
        proxy_pass http://api/;
    }
}
