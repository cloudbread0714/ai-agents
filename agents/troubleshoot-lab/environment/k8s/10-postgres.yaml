# The postgres-init ConfigMap is generated by restore.sh from environment/postgres/init.sql.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab
  labels: {app: postgres, lab.managed: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Local-only practice credentials, not a secret (research R14).
          env:
            - {name: POSTGRES_USER, value: lab}
            - {name: POSTGRES_PASSWORD, value: lab}
            - {name: POSTGRES_DB, value: lab}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "lab"]}
            periodSeconds: 2
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab
  labels: {app: postgres, lab.managed: "true"}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
