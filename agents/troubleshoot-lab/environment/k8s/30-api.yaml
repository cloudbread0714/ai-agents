apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab
  labels: {app: api, lab.managed: "true"}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: lab-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATABASE_URL, value: "postgresql://lab:lab@postgres:5432/lab"}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: APP_VERSION, value: "1.0.0"}
            - {name: EXT_URL, value: "http://ext:8000"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab
  labels: {app: api, lab.managed: "true"}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
