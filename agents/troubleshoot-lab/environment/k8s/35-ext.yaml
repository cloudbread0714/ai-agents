apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext
  namespace: lab
  labels: {app: ext, lab.managed: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ext}
  template:
    metadata:
      labels: {app: ext}
    spec:
      containers:
        - name: ext
          image: lab-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_ROLE, value: ext}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ext
  namespace: lab
  labels: {app: ext, lab.managed: "true"}
spec:
  selector: {app: ext}
  ports: [{port: 8000, targetPort: 8000}]
