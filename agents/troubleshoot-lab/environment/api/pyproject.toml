[project]
name = "lab-api"
version = "1.0.0"
description = "Sample API used as the troubleshooting target (not part of the uv workspace)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
