# Base nginx config for the compose environment. `work_reset` copies this into
# $LAB_WORK/nginx/, which the container mounts; scenarios break the copy, never this file.
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=lab:10m max_size=50m inactive=1h;

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/conf.d/certs/site.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/site.key;

    # Re-resolve the api container on every request (Docker's embedded DNS), so a
    # recreated api container is picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_host api:8000;

    add_header X-Cache-Status $upstream_cache_status always;

    location /healthz {
        proxy_pass http://$api_host/healthz;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_host;
        proxy_read_timeout 3s;
    }

    # Extra locations dropped in by missions and scenarios.
    include /etc/nginx/conf.d/locations/*.conf;
}
