# Dedicated practice cluster. Created by `make up` with its own kubeconfig
# (environment/.kube/config), so the user's ~/.kube/config is never touched.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: troubleshoot-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        listenAddress: "127.0.0.1"
