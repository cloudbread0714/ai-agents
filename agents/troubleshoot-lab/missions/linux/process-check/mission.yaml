id: process-check
env: compose
kind: warmup
title: CPU를 쓰는 프로세스 찾기
minutes: 15
goals:
- top -b 로 Load Average 와 CPU 사용률을 읽는다
- ps aux --sort 로 CPU를 가장 많이 쓰는 프로세스를 찾는다
- PID 로 프로세스를 종료한다
steps:
- id: load
  guide: |
    Mac 호스트에는 이 리눅스 명령이 없거나 다르게 동작해요. `lab exec <서비스> -- <명령>` 은 진단 도구 컨테이너를 그 서비스의 네트워크·프로세스 공간에 붙여 실행해요(Claude Code에서는 `/lab-exec <서비스> <명령>`).
    `top -b -n 1` 은 화면을 한 번만 찍고 끝나요(-b: 비대화형). 첫 줄의 `load average` 는 1분·5분·15분 평균으로,
    실행 중이거나 실행을 기다리는 프로세스 수예요. CPU 코어 수보다 계속 크면 CPU가 부족하다는 뜻이에요.
    `%Cpu(s)` 줄의 us(사용자), sy(커널), id(유휴), wa(I/O 대기)도 함께 보세요.
  command: agents/troubleshoot-lab/bin/lab exec api -- 'top -b -n 1 | head -12'
  check: answer
  prompt: load average 는 숫자 몇 개로 되어 있나요?
- id: top-cpu
  guide: api 컨테이너 안에서 무언가가 CPU를 계속 쓰고 있어요. `ps aux --sort=-%cpu` 는 모든 프로세스를 CPU 사용률이 높은 순(-)으로 보여 줘요. 맨 위 줄을 보세요.
  command: agents/troubleshoot-lab/bin/lab exec api -- 'ps aux --sort=-%cpu | head -5'
  check: answer
  prompt: CPU를 가장 많이 쓰는 프로세스의 COMMAND 를 입력하세요(경로째 붙여도 돼요)
- id: kill
  guide: |
    찾은 프로세스의 PID 로 종료 신호(기본 SIGTERM)를 보내세요. 아래 명령의 `<PID>` 를 위에서 본 숫자로 바꾸면 돼요.
    끝낸 뒤 `/lab-check kill` 로 확인해요.
  command: agents/troubleshoot-lab/bin/lab exec api -- kill <PID>
  check: state
