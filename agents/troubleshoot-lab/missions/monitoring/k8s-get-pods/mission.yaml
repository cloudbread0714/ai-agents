id: k8s-get-pods
env: kind
kind: warmup
title: Pod 상태 읽기
minutes: 15
goals:
- kubectl 이 어느 클러스터를 보고 있는지 확인한다
- kubectl get pods 의 NAME·READY·STATUS·RESTARTS 를 읽는다
- 라벨을 함께 본다
steps:
- id: context
  guide: kubectl 은 KUBECONFIG 가 가리키는 클러스터로 명령을 보내요. 실습용 클러스터만 보도록 전용 설정을 잡고, 지금 context를 확인하세요.
  command: |
    eval "$(agents/troubleshoot-lab/bin/lab env)"
    kubectl config current-context
  check: answer
  prompt: 출력된 context 이름을 입력하세요
- id: list
  guide: '`kubectl -n lab get pods` 는 lab 네임스페이스의 Pod 목록이에요. READY(준비된 컨테이너 수), STATUS(상태), RESTARTS(재시작 횟수)를 읽어 보세요.'
  command: kubectl -n lab get pods
  check: answer
  prompt: quiz- 로 시작하는 Pod 이름에서 quiz- 뒤의 값을 입력하세요
- id: labels
  guide: 라벨은 Pod을 고르는 기준이에요(Service와 Deployment가 라벨로 Pod을 찾아요). `--show-labels` 로 함께 볼 수 있어요.
  command: kubectl -n lab get pods --show-labels
  check: answer
  prompt: quiz Pod의 level 라벨 값을 입력하세요
