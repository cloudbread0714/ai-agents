id: k8s-describe
env: kind
kind: warmup
title: describe 와 Events 읽기
minutes: 15
goals:
- kubectl describe 로 리소스의 자세한 상태를 본다
- Events 에서 실패 이유를 찾는다
steps:
- id: pod
  guide: |
    이 쉘에서 처음이라면 먼저 `eval "$(agents/troubleshoot-lab/bin/lab env)"` 를 실행해 실습 클러스터와 compose 설정을 잡아 두세요.
    `kubectl describe pod` 는 Pod의 설정, 상태, 그리고 맨 아래 Events(최근에 일어난 일)를 보여 줘요. quiz-describe Pod이 왜 시작하지 못하는지 Events에서 찾아보세요.
  command: kubectl -n lab describe pod quiz-describe
  check: answer
  prompt: Events에서 받아오지 못한 이미지의 태그(lab- 뒤의 값)를 입력하세요
- id: deploy
  guide: Deployment 같은 다른 리소스도 describe 할 수 있어요. 위쪽의 Labels/Annotations 부분을 읽어 보세요.
  command: kubectl -n lab describe deploy api
  check: answer
  prompt: Annotations 에서 lab/quiz 값을 입력하세요
