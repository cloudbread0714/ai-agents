id: http-headers
env: compose
kind: warmup
title: 요청·응답 헤더
minutes: 15
goals:
- 응답 헤더를 curl -I 로 읽는다
- curl -H 로 요청 헤더를 보낸다
- Content-Type 의 의미를 안다
steps:
- id: response
  guide: '`curl -I` 는 HEAD 요청을 보내 응답 헤더만 보여 줘요(`-i` 는 헤더와 본문을 함께). 서버가 붙인 사용자 정의 헤더를 찾아보세요.'
  command: curl -sI localhost:8080/quiz-headers
  check: answer
  prompt: X-Lab-Quiz 헤더 값을 입력하세요
- id: request
  guide: '요청 헤더는 `-H ''이름: 값''` 으로 보내요. 이 경로는 X-Lab-Ask: hello 헤더가 있어야 답을 줘요.'
  command: 'curl -s -H ''X-Lab-Ask: hello'' localhost:8080/quiz-echo'
  check: answer
  prompt: 응답의 code 값을 입력하세요
- id: type
  guide: Content-Type 헤더는 본문이 어떤 형식인지 알려 줘요(text/html, application/json 등).
  command: curl -sI localhost:8080/quiz-headers | grep -i content-type
  check: answer
  prompt: Content-Type 값을 입력하세요
