id: psql-basics
env: compose
kind: warmup
title: psql 로 DB 상태 보기
minutes: 20
goals:
- max_connections 로 DB가 받을 수 있는 연결 수를 안다
- pg_stat_activity 로 지금 연결된 세션을 본다
- EXPLAIN 으로 쿼리가 인덱스를 쓰는지 본다
steps:
- id: max
  guide: |
    Mac 호스트에는 이 리눅스 명령이 없거나 다르게 동작해요. `lab exec <서비스> -- <명령>` 은 진단 도구 컨테이너를 그 서비스의 네트워크·프로세스 공간에 붙여 실행해요(Claude Code에서는 `/lab-exec <서비스> <명령>`).
    `psql -c '<SQL>'` 로 쿼리 하나를 실행하고 끝낼 수 있어요(-A -t: 표 장식 없이 값만).
    비밀번호 `lab` 은 로컬 실습 전용 고정값이에요.
  command: agents/troubleshoot-lab/bin/lab exec postgres -- "PGPASSWORD=lab psql -h localhost -U lab -d lab -Atc 'SHOW max_connections'"
  check: answer
  prompt: 출력된 값을 입력하세요
- id: activity
  guide: |
    `pg_stat_activity` 는 지금 열린 연결 하나당 한 줄이에요. `state` 가 active 면 쿼리 실행 중, idle 이면 연결만 잡고 쉬는 중이에요.
    api 는 커넥션 풀로 연결을 미리 열어 두고 재사용해요.
  command: agents/troubleshoot-lab/bin/lab exec postgres -- "PGPASSWORD=lab psql -h localhost -U lab -d lab -c \"SELECT pid, client_addr, state, left(query, 40) AS query FROM pg_stat_activity WHERE datname = 'lab'\""
  check: answer
  prompt: psql 자신이 아닌, api 가 열어 둔 연결의 state 값을 입력하세요
- id: explain
  guide: |
    `EXPLAIN` 은 쿼리를 실제로 돌리지 않고 실행 계획만 보여 줘요. `Seq Scan` 은 테이블 전체를 읽는 것이고,
    `Index Scan`·`Bitmap Index Scan` 은 인덱스로 필요한 행만 찾는 거예요. `EXPLAIN ANALYZE` 는 실제로 실행해 걸린 시간까지 보여 줘요.
  command: agents/troubleshoot-lab/bin/lab exec postgres -- "PGPASSWORD=lab psql -h localhost -U lab -d lab -c 'EXPLAIN ANALYZE SELECT count(*) FROM orders WHERE customer_id = 42'"
  check: answer
  prompt: 실행 계획에 나온 인덱스 이름을 입력하세요
