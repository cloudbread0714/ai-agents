id: cache-headers
env: compose
kind: warmup
title: 캐시 헤더 이해하기
minutes: 15
goals:
- Cache-Control 의 max-age 를 읽는다
- 프록시 캐시의 HIT/MISS 를 응답 헤더로 확인한다
steps:
- id: maxage
  guide: Cache-Control 헤더는 응답을 얼마나, 누가 저장해도 되는지 알려 줘요. `max-age=초` 는 그 시간 동안 다시 요청하지 않고 저장본을 써도 된다는 뜻이에요.
  command: curl -sI localhost:8080/quiz-cache
  check: answer
  prompt: Cache-Control 의 max-age 숫자를 입력하세요
- id: hit
  guide: 이 경로는 nginx가 응답을 캐시해요. 실습 nginx는 X-Cache-Status 헤더로 캐시에서 나왔는지(HIT) 새로 받아왔는지(MISS) 알려 줘요. 연달아 두 번 요청해 보세요.
  command: |
    curl -s -o /dev/null localhost:8080/quiz-cache
    curl -sI localhost:8080/quiz-cache | grep -i x-cache-status
  check: answer
  prompt: 두 번째 요청의 X-Cache-Status 값을 입력하세요
