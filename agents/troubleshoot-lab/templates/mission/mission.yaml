# 복사 후: 디렉터리 이름 = id, 상위 디렉터리 = 분야
# (network | linux | webserver | db-cache | lb-cloud | monitoring).
id: my-mission
env: compose                # 미션을 실행할 환경: compose | kind
kind: warmup                # warmup | concept (개념 일차용, minutes 30~90)
title: 미션 제목 (60자 이내)
minutes: 15                 # warmup 5~60, concept 30~90
goals:
  - 이 미션으로 익힐 것 1
steps:
  - id: look
    guide: |
      이 단계에서 배울 개념을 설명하세요.
      Mac 호스트에 없는 명령(ss, free, vmstat, top, dig 등)은 lab exec 로 진단 컨테이너에서 실행해요.
    # 레포 루트에서 그대로 복사해 실행할 수 있는 비대화형 명령 (-it, 에디터, 페이저 금지)
    command: agents/troubleshoot-lab/bin/lab exec api -- ss -lntp
    check: answer          # state = 환경 상태로 판정, answer = 사용자가 값을 입력
    prompt: 무엇을 입력할지 설명하세요   # check: answer 일 때 필수
