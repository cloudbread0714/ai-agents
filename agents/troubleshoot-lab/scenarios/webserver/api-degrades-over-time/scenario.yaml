- linux
env: compose
title: 시간이 지날수록 API가 망가져요
difficulty: intermediate
minutes: 45
symptom: localhost:8080/api/upstream 이 처음엔 잘 되다가, 요청이 쌓이면 500 오류가 나기 시작해요. api를 재시작하면 한동안 괜찮아요.
tags:
- close-wait
- socket-leak
- fd
