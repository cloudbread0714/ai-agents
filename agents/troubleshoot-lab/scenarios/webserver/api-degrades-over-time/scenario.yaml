- tcp-states
- socket-check
start_hint: curl -i localhost:8080/api/upstream
measure:
  path: /api/upstream
  service: api
interview:
- CLOSE_WAIT가 계속 늘어나면 무엇을 의심해야 하나요?
- TIME_WAIT가 많은 것은 문제인가요?
