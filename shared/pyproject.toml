[project]
name = "shared"
version = "0.1.0"
description = "Code shared by agents: Slack, LLM client, config, retry, logging"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tenacity>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
