[project]
name = "ai-agents"
version = "0.1.0"
description = "Monorepo for AI agents"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "agents/*"]
# The lab's sample API is a practice target with its own uv project and lock.
exclude = ["agents/troubleshoot-lab/environment/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "news_digest", "nd_support", "troubleshoot_lab", "tl_support"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "agents/news-digest/tests", "agents/troubleshoot-lab/tests"]
addopts = "--import-mode=importlib"
# src paths too: workspace packages import even if the editable .pth is skipped
# (e.g. a .venv inside an iCloud-synced folder gets its files flagged hidden).
pythonpath = [
    "shared/src",
    "agents/news-digest/src",
    "agents/news-digest/tests",
    "agents/troubleshoot-lab/src",
    "agents/troubleshoot-lab/tests",
]
markers = ["sandbox: needs real docker + kind (LAB_SANDBOX=1)"]
